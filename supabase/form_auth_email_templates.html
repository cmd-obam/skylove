<!--
============================================================
회원가입 이메일 인증 템플릿 (Magic Link)
Supabase Dashboard → Authentication → Email Templates → Magic Link

현재 회원가입은 supabase.auth.signInWithOtp() 를 사용하므로
발송 템플릿은 "Magic Link" 입니다. (Confirm sign up / Email OTP 아님)

아래 Subject / Body 를 Dashboard Magic Link 템플릿에 그대로 붙여넣으세요.
다른 템플릿(Confirm sign up, Reset Password 등)은 수정하지 마세요.
============================================================
-->

<!-- Subject -->
[하늘사랑교회] 이메일 인증을 완료해주세요.

<!-- Body -->
<h2>하늘사랑교회</h2>

<p>안녕하세요.</p>

<p>
하늘사랑교회 홈페이지 회원가입을 진행해주셔서 감사합니다.
</p>

<p>
아래 버튼을 눌러 이메일 인증을 완료해주세요.
</p>

<p style="margin:30px 0;">
<a href="{{ .ConfirmationURL }}"
style="
display:inline-block;
padding:14px 30px;
background:#4A90E2;
color:#ffffff;
text-decoration:none;
border-radius:6px;
font-weight:bold;
">
이메일 인증하기
</a>
</p>

<p>
버튼이 동작하지 않는 경우 아래 주소를 복사하여 브라우저에 붙여넣어 주세요.
</p>

<p>
{{ .ConfirmationURL }}
</p>

<hr>

<p style="font-size:13px;color:#777;">
본 메일은 하늘사랑교회 회원가입 이메일 인증을 위한 자동 발송 메일입니다.
문의사항은 하늘사랑교회로 연락해 주세요.
</p>
