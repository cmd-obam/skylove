# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "skylove"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[functions.find_by_name_email]
verify_jwt = false

[functions.verify_security_answer]
verify_jwt = false

[functions.reset-password]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.admin-delete-member]
verify_jwt = true

[functions.purge-content-trash]
verify_jwt = false

[functions.convert-kakao-to-email-login]
verify_jwt = true

# Local Auth email templates only. Hosted project: paste the same content in
# Dashboard → Authentication → Email Templates → Magic Link
# (signup uses signInWithOtp → Magic Link template)
[auth.email.template.magic_link]
subject = "[하늘사랑교회] 이메일 인증을 완료해주세요."
content_path = "./email-templates/magic-link.html"
